name: taskmgr
description: 随随办办 / FlowDo — 无压力任务管理
publish_to: "none"
version: 0.0.4+4

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  http: ^1.2.2
  shared_preferences: ^2.3.3
  intl: ^0.20.3
  flutter_slidable: ^4.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Variable.ttf
    - family: ZCOOLKuaiLe
      fonts:
        - asset: assets/fonts/ZCOOLKuaiLe-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/flowdo_app_icon.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/branding/flowdo_app_icon.png
    background_color: "#E8F5EE"
    theme_color: "#4F8F70"
  windows:
    generate: true
    image_path: assets/branding/flowdo_app_icon.png
    icon_size: 256
