services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowdo
      POSTGRES_PASSWORD: flowdo
      POSTGRES_DB: flowdo
    volumes:
      - flowdo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowdo"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: flowdo-server:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://flowdo:flowdo@db:5432/flowdo
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      JWT_ACCESS_EXPIRES: 30m
      JWT_REFRESH_EXPIRES: 7d
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      db:
        condition: service_healthy

volumes:
  flowdo_data:
