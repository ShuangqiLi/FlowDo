server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/html text/css text/plain application/javascript application/json image/svg+xml;

    # 构建时已经压好 .gz，直接发，省掉每次请求的压缩开销（中文字体有十几兆）。
    gzip_static on;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml application/octet-stream;

    # 大文件用 sendfile 直接从内核发，nginx 不再搬一遍。
    sendfile on;
    tcp_nopush on;

    # 网页端永远同源调用 API。容器网络里直接找 api，不把内部地址暴露给浏览器。
    location ~ ^/(auth|tasks|me|briefing|archive|health)(/|$) {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
    }

    # 字体、图标、CanvasKit 都在这两个目录里，镜像里只放了 .gz 版本：
    # gzip_static always 不管客户端支不支持都发 .gz，不支持的由 gunzip 现场解开。
    # 这里不能用 try_files（它只认原文件名），缺文件由静态模块自己回 404：
    # 要是让首页去顶包，浏览器拿到一段 HTML 当字体解析，界面就是满屏方块。
    #
    # 这些文件名也不带 hash，内容却会随版本变（图标字体是按用到的图标裁剪出来的，升级后
    # 旧缓存里就少图标）。no-cache 让浏览器每次带 ETag 来问一声，没变就 304，内网里几乎不花时间。
    location ~ ^/(assets|canvaskit)/ {
        gzip_static always;
        gunzip on;
        add_header Cache-Control "no-cache";
    }

    # 这几个文件名不带 hash，缓存住就再也升不动版本。
    location ~ ^/(index\.html|main\.dart\.js|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
