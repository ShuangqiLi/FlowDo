# 内网部署：数据库只在容器网络里，网页端和 API 端口可配置。
#
# 源码构建后：
#   docker build -t flowdo-server:latest ./server
#   (cd app && flutter build web --release --no-web-resources-cdn)
#   docker build -f web/Dockerfile -t flowdo-web:latest .
#   docker compose up -d
#   浏览器打开 http://<主机 IP>:8080。
#   网页端把 API 路径同源反代到 api:3000，客户端不用知道 API 地址。
name: flowdo

services:
  db:
    image: postgres:16-alpine
    pull_policy: if_not_present
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowdo
      POSTGRES_PASSWORD: flowdo
      POSTGRES_DB: flowdo
    volumes:
      - flowdo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowdo"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: flowdo-server:latest
    pull_policy: if_not_present
    restart: unless-stopped
    ports:
      - "${FLOWDO_API_BIND:-0.0.0.0}:${API_PORT:-13000}:3000"
    environment:
      DATABASE_URL: postgresql://flowdo:flowdo@db:5432/flowdo
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ACCESS_EXPIRES: 30m
      JWT_REFRESH_EXPIRES: 7d
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  web:
    image: flowdo-web:latest
    pull_policy: if_not_present
    restart: unless-stopped
    ports:
      - "${FLOWDO_WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  flowdo_data:
