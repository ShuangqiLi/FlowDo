name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notes from CHANGELOG
        run: |
          python3 << 'PY'
          from pathlib import Path
          import os

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith("v") else tag
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          out = []
          capture = False
          for line in text.splitlines():
              if line.startswith("## ["):
                  if capture:
                      break
                  if line.startswith(f"## [{version}]"):
                      capture = True
                      continue
              elif capture:
                  if line.startswith("[") and "]: " in line:
                      break
                  out.append(line)
          notes = "\n".join(out).strip() or f"FlowDo {tag}"
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # Use the Releases API so we do not depend on a local git tag matching
          # the GitHub remote (gh release create fails with "exists locally but
          # has not been pushed" on tag-push checkouts).
          jq -n \
            --rawfile body release-notes.md \
            --arg tag "$TAG" \
            --arg sha "$SHA" \
            '{tag_name:$tag, name:$tag, target_commitish:$sha, body:$body}' \
          | gh api "repos/$GH_REPO/releases" --method POST --input -
