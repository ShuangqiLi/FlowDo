name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check the web client
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build the web client
        working-directory: app
        run: flutter build web --release --no-web-resources-cdn
      - name: Build Docker images
        run: |
          docker build -t flowdo-server:latest ./server
          docker build -f web/Dockerfile -t flowdo-web:latest .
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/package/web-build
          cp docker-compose.yml dist/package/
          cp release/docker/start.sh release/docker/start.ps1 release/docker/README.md dist/package/
          cp -R app/build/web/. dist/package/web-build/
          docker save flowdo-server:latest | gzip -9 > dist/package/flowdo-server-image.tar.gz
          docker save flowdo-web:latest | gzip -9 > dist/package/flowdo-web-image.tar.gz
          (cd dist/package && zip -9 -r "../FlowDo-docker-${TAG}.zip" .)
          rm -rf dist/package
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Notes from CHANGELOG
        run: |
          python3 << 'PY'
          from pathlib import Path
          import os

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith("v") else tag
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          out = []
          capture = False
          for line in text.splitlines():
              if line.startswith("## ["):
                  if capture:
                      break
                  if line.startswith(f"## [{version}]"):
                      capture = True
                      continue
              elif capture:
                  if line.startswith("[") and "]: " in line:
                      break
                  out.append(line)
          notes = "\n".join(out).strip() or f"FlowDo {tag}"
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          payload="$(mktemp)"
          jq -n \
            --rawfile body release-notes.md \
            --arg tag "$TAG" \
            --arg sha "$SHA" \
            '{tag_name:$tag, name:$tag, target_commitish:$sha, body:$body}' \
            > "$payload"

          if gh api "repos/$GH_REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            release_id="$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id)"
            gh api "repos/$GH_REPO/releases/$release_id" \
              --method PATCH --input "$payload" >/dev/null
          else
            gh api "repos/$GH_REPO/releases" \
              --method POST --input "$payload" >/dev/null
          fi

          gh release upload "$TAG" dist/* \
            --repo "$GH_REPO" \
            --clobber
