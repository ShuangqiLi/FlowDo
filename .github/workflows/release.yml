name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # 服务端镜像和网页端互不依赖，拆成两个 job 并行跑；服务端 npm 依赖层用 GitHub Actions 缓存，
  # lockfile 没动时几十秒就出镜像。
  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          load: true
          tags: flowdo-server:latest
          # runner 在海外，直连官方源比走国内镜像快。
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
            PRISMA_ENGINES_MIRROR=https://binaries.prisma.sh
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: Save the API image
        run: |
          mkdir -p out
          docker image inspect -f '{{.Id}}' flowdo-server:latest > out/flowdo-server-image.id
          docker save flowdo-server:latest | pigz -9 > out/flowdo-server-image.tar.gz
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: server-image
          path: out/*
          compression-level: 0
          if-no-files-found: error

  web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check the web client
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build the web client
        working-directory: app
        run: flutter build web --release --no-web-resources-cdn
      - uses: docker/setup-buildx-action@v3
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          load: true
          tags: flowdo-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Save the web image
        run: |
          mkdir -p out
          docker image inspect -f '{{.Id}}' flowdo-web:latest > out/flowdo-web-image.id
          docker save flowdo-web:latest | pigz -9 > out/flowdo-web-image.tar.gz
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: web-image
          path: out/*
          compression-level: 0
          if-no-files-found: error

  package:
    needs: [server-image, web-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/package
          merge-multiple: true
      # 包里只放部署要用的东西：编排、两个镜像（带 .id）、一键脚本和一份说明。
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cp docker-compose.yml start.sh start.ps1 dist/package/
          cp DEPLOY.md dist/package/README.md
          chmod +x dist/package/start.sh
          ls -lh dist/package
          # 镜像 tar 已经是 gzip，zip 里只存不压，省下这一步的时间。
          (cd dist/package && zip -r -n .gz "../FlowDo-${TAG}.zip" .)
          rm -rf dist/package
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  github-release:
    needs: [package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Notes from CHANGELOG
        run: |
          python3 << 'PY'
          from pathlib import Path
          import os

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith("v") else tag
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          out = []
          capture = False
          for line in text.splitlines():
              if line.startswith("## ["):
                  if capture:
                      break
                  if line.startswith(f"## [{version}]"):
                      capture = True
                      continue
              elif capture:
                  if line.startswith("[") and "]: " in line:
                      break
                  out.append(line)
          notes = "\n".join(out).strip() or f"FlowDo {tag}"
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          payload="$(mktemp)"
          jq -n \
            --rawfile body release-notes.md \
            --arg tag "$TAG" \
            --arg sha "$SHA" \
            '{tag_name:$tag, name:$tag, target_commitish:$sha, body:$body}' \
            > "$payload"

          if gh api "repos/$GH_REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            release_id="$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id)"
            gh api "repos/$GH_REPO/releases/$release_id" \
              --method PATCH --input "$payload" >/dev/null
          else
            gh api "repos/$GH_REPO/releases" \
              --method POST --input "$payload" >/dev/null
          fi

          gh release upload "$TAG" dist/* \
            --repo "$GH_REPO" \
            --clobber
